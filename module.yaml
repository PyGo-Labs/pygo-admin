name: pygo-admin
version: 0.4.0
description: "Advanced admin panel components for PyGo — DataTable, FormBuilder, RBAC, Dashboard, Reports"
author: "PyGo Labs"
homepage: "https://pygo.dev/admin"
repository: "https://github.com/pygo-labs/pygo-admin"
documentation: "https://docs.pygo.dev/admin"

pygo_version: ">=1.0.0"

dependencies:
  modules:
    - pygo-ui: ">=0.2.0"  # Hereda Button, Input, Card, Modal, layouts, themes, icons

  assets:
    - chart.js: "^4.4.0"
    - sorttable.js: "^1.0.0"

features:
  - name: "data-table"
    description: "Data tables with sorting and pagination"
    enabled: true

  - name: "form-builder"
    description: "Auto-generated forms from models"
    enabled: true

  - name: "audit-log"
    description: "Audit trail viewer and change diff"
    enabled: true

  - name: "reports"
    description: "Report builder with multi-format export"
    enabled: true

  - name: "settings"
    description: "System configuration panel"
    enabled: true

  - name: "user-management"
    description: "User creation, editing, roles assignment"
    enabled: true

  - name: "role-manager"
    description: "RBAC role and permission management"
    enabled: true

ui:
  config_path: "config/admin.yaml"
  assets_path: "public/vendor/pygo-admin"
  components_path: "components/pygo-admin"

hooks:
  on_install: "hooks.install"
  on_uninstall: "hooks.uninstall"
