{# src/components/form-builder/form-builder.html #}
{% macro form_builder(endpoint, fields=[], submit_text="Guardar", reset_text="Limpiar") %}
<form x-data="formBuilder('{{ endpoint }}', {
  fields: {{ fields|tojson|safe }}
})" @submit.prevent="handleSubmit()"
  class="space-y-6 bg-white rounded-lg shadow p-6">

  <!-- Dynamic fields -->
  <template x-for="field in fields" :key="field.name">
    <div class="field-group"
      :class="{ 'mb-6': true, 'opacity-50': field.disabled }">

      <!-- Label -->
      <label class="block text-sm font-medium text-gray-700 mb-1"
        x-text="field.label"></label>

      <!-- Required indicator -->
      <span x-show="field.required" class="text-red-500">*</span>

      <!-- Field wrapper -->
      <div class="mt-1">

        <!-- Text input -->
        <template x-if="field.type === 'text' || field.type === 'email' || field.type === 'password'">
          <input :type="field.type"
            :name="field.name"
            x-model="values[field.name]"
            :placeholder="field.placeholder"
            :disabled="field.disabled"
            :required="field.required"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                   focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   disabled:bg-gray-100 disabled:cursor-not-allowed">
        <template x-if="field.type === 'textarea'">
          <textarea :name="field.name"
            x-model="values[field.name]"
            :placeholder="field.placeholder"
            :disabled="field.disabled"
            rows="4"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                   focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   disabled:bg-gray-100 disabled:cursor-not-allowed"></textarea>

        <!-- Select -->
        <template x-if="field.type === 'select'">
          <select :name="field.name"
            x-model="values[field.name]"
            :required="field.required"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                   focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="" disabled selected>Seleccione...</option>
            <template x-for="opt in field.options" :key="opt.value">
              <option :value="opt.value" x-text="opt.label"></option>
            </template>
          </select>

        <!-- Checkbox -->
        <template x-if="field.type === 'checkbox'">
          <label class="flex items-center">
            <input type="checkbox"
              :name="field.name"
              x-model="values[field.name]"
              :value="field.check_value|default('1')"
              class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-sm text-gray-700" x-text="field.label"></span>
          </label>

        <!-- Radio -->
        <template x-if="field.type === 'radio'">
          <div class="flex flex-wrap gap-4">
            <template x-for="opt in field.options" :key="opt.value">
              <label class="flex items-center">
                <input type="radio"
                  :name="field.name"
                  :value="opt.value"
                  x-model="values[field.name]"
                  class="border border-gray-300 text-blue-600 focus:ring-blue-500">
                <span class="ml-2 text-sm text-gray-700" x-text="opt.label"></span>
              </label>
            </template>
          </div>

        <!-- File -->
        <template x-if="field.type === 'file'">
          <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center
                     hover:border-gray-400 transition-colors">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M7 16V4h10v12m0 0l-5-5m5 5l-5 5"></path>
            </svg>
            <input type="file" :name="field.name"
              class="hidden"
              @change="handleFileUpload($event)">
            <button type="button"
              @click="$el.previousElementSibling.click()"
              class="mt-2 text-sm text-blue-600 hover:text-blue-700">
              Seleccionar archivo
            </button>
          </div>
      </div>

      <!-- Help text / Error -->
      <p class="mt-1 text-sm text-gray-500" x-text="field.help_text"></p>
      <p class="mt-1 text-sm text-red-600" x-show="errors[field.name]" x-text="errors[field.name]"></p>
    </div>
  </template>

  <!-- Actions -->
  <div class="flex justify-end gap-3 pt-6 border-t border-gray-200">
    <button type="button"
      @click="resetForm()"
      class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">
      {{ reset_text }}
    </button>
    <button type="submit"
      :disabled="loading || !isValid()"
      class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg
             hover:bg-blue-700 disabled:opacity-50 focus:ring-2 focus:ring-blue-500">
      <svg x-show="loading" class="animate-spin -ml-1 mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span x-text="loading ? 'Guardando...' : '{{ submit_text }}'"></span>
    </button>
  </div>
</form>
{% endmacro %}
