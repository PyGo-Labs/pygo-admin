{# src/components/form-builder/form-builder-advanced.html #}
{% macro form_builder_advanced(
  endpoint,
  schema=[],
  model=null,
  submit_text="Guardar",
  reset_text="Limpiar"
) %}
<form x-data="advancedFormBuilder({
  endpoint: '{{ endpoint }}',
  schema: {{ schema|tojson|safe }},
  initialData: {{ model|tojson|safe }}
})"
  @submit.prevent="handleSubmit"
  class="space-y-6 bg-white rounded-xl shadow-lg p-6">

  <!-- Form header -->
  <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-200">
    <h2 class="text-xl font-bold text-gray-900">Editar Formulario</h2>
    <button type="button"
      @click="resetForm()"
      class="text-sm text-gray-600 hover:text-gray-900">
      Reiniciar
    </button>
  </div>

  <!-- Dynamic fields -->
  <template x-for="field in schema" :key="field.name">
    <div class="field-wrapper"
      :class="{ 'mb-6': true, 'opacity-50': field.disabled }">

      <div class="flex items-start justify-between">
        <!-- Label -->
        <label :for="field.name" class="block text-sm font-medium text-gray-700 mb-1">
          <span x-text="field.label"></span>
          <span x-show="field.required" class="text-red-500">*</span>

          <!-- Help tooltip -->
          <span x-show="field.help"
            class="ml-1 text-gray-400 cursor-help"
            title=""
            x-title="field.help">
            <svg class="inline-block w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 16h-1v-4h-1m0-4h.01M12 11h.01M12 15h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </span>
        </label>

        <!-- Field type indicator -->
        <span class="text-xs text-gray-400 uppercase"
          x-text="field.type"></span>
      </div>

      <!-- Input rendering based on type -->
      <div class="mt-2">

        <!-- Text / Email / Password -->
        <template x-if="['text', 'email', 'password', 'number', 'tel'].includes(field.type)">
          <input :type="field.type"
            :name="field.name"
            x-model="values[field.name]"
            :placeholder="field.placeholder"
            :disabled="field.disabled"
            :required="field.required"
            :class="{
              'w-full px-3 py-2 border rounded-lg text-sm transition-all': true,
              'border-red-300 focus:ring-red-500': hasError(field.name),
              'border-green-500 focus:ring-green-500': !hasError(field.name) && values[field.name],
              'border-gray-300 focus:ring-blue-500': !hasError(field.name) && !values[field.name]
            }">

        <!-- Textarea -->
        <template x-if="field.type === 'textarea'">
          <textarea :name="field.name"
            x-model="values[field.name]"
            :placeholder="field.placeholder"
            :rows="field.rows|default(4)"
            :disabled="field.disabled"
            :required="field.required"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 transition-all resize-y"></textarea>

        <!-- Select -->
        <template x-if="field.type === 'select'">
          <select :name="field.name"
            x-model="values[field.name]"
            :required="field.required"
            :disabled="field.disabled"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 transition-all">
            <option value="" disabled selected>Seleccione...</option>
            <template x-for="opt in field.options" :key="opt.value">
              <option :value="opt.value" x-text="opt.label"></option>
            </template>
          </select>

        <!-- Relation / Foreign Key -->
        <template x-if="field.type === 'relation'">
          <select :name="field.name"
            x-model="values[field.name]"
            :required="field.required"
            x-data="{ loading: true }"
            x-init="fetchRelations('{{ field.relation_endpoint }}')"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 transition-all">
            <option value="" disabled selected>Cargando...</option>
            <template x-for="rel in relationOptions" :key="rel.id">
              <option :value="rel.id" x-text="rel.name"></option>
            </template>
          </select>

        <!-- Date / DateTime -->
        <template x-if="['date', 'datetime'].includes(field.type)">
          <input :type="field.type"
            :name="field.name"
            x-model="values[field.name]"
            :disabled="field.disabled"
            :required="field.required"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 transition-all">

        <!-- File upload -->
        <template x-if="field.type === 'file'">
          <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center
                       hover:border-gray-400 transition-colors">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M7 16V4h10v12m0 0l-5-5m5 5l-5 5" />
            </svg>
            <div class="mt-2">
              <label class="cursor-pointer text-blue-600 hover:text-blue-700">
                Seleccionar archivo
                <input type="file"
                  :name="field.name"
                  x-on:change="handleFileUpload($event)"
                  class="hidden">
              </label>
            </div>
            <p class="text-xs text-gray-500 mt-1" x-text="field.help|default('Haz clic para subir')"></p>
          </div>

        <!-- Boolean / Switch -->
        <template x-if="field.type === 'boolean'">
          <label class="flex items-center cursor-pointer py-2">
            <div x-switch
              x-model="values[field.name]"
              class="relative inline-flex h-6 w-10 items-center rounded-full transition-colors">
              <div x-bind:class="{ 'translate-x-5': values[field.name], 'translate-x-1': !values[field.name] }"
                class="inline-block h-5 w-5 transform bg-white rounded-full shadow ring-1 ring-black ring-opacity-5 transition">
              </div>
            </div>
            <span class="ml-3 text-sm text-gray-700" x-text="field.label|default('Active')"></span>
          </label>

        <!-- JSON / Array -->
        <template x-if="['json', 'array'].includes(field.type)">
          <div class="border border-gray-300 rounded-lg p-3">
            <textarea :name="field.name"
              x-model="values[field.name]"
              rows="4"
              placeholder="JSON array..."
              class="w-full px-2 py-1 font-mono text-sm text-gray-900 bg-gray-50 border-0
                          focus:ring-0 resize-y"
              x-text="JSON.stringify(values[field.name] || {}, null, 2)"></textarea>
          </div>

        <!-- Markdown -->
        <template x-if="field.type === 'markdown'">
          <div class="border border-gray-300 rounded-lg">
            <textarea :name="field.name"
              x-model="values[field.name]"
              rows="6"
              class="w-full px-3 py-2 border-0 rounded-lg font-mono text-sm focus:ring-0
                          resize-y"
              placeholder="# Markdown content..."></textarea>
          </div>
      </div>

      <!-- Error / Help text -->
      <div class="mt-1">
        <p x-show="hasError(field.name)"
          class="text-sm text-red-600"
          x-text="errors[field.name]"
          x-cloak></p>
        <p x-show="!hasError(field.name) && field.help"
          class="text-sm text-gray-500"
          x-text="field.help"
          x-cloak></p>
      </div>

    </div>
  </template>

  <!-- Action buttons -->
  <div class="flex justify-end gap-3 pt-6 border-t border-gray-200">
    <button type="button"
      @click="resetForm()"
      :disabled="loading"
      class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50">
      {{ reset_text }}
    </button>
    <button type="submit"
      :disabled="loading || !isValid"
      class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg
             hover:bg-blue-700 disabled:opacity-50 focus:ring-2 focus:ring-blue-500">
      <svg x-show="loading" class="animate-spin -ml-1 mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span x-text="loading ? 'Guardando...' : '{{ submit_text }}'"></span>
    </button>
  </div>

</form>
{% endmacro %}
